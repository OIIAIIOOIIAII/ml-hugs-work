seed: 0
mode: human_scene
output_path: output
# Stage 3b: Scene from Scratch — freeze human + attention, re-initialize scene
# from point cloud and train for 8000 steps with human at Stage-2 corrected positions.
exp_name: depth_sup12k_scene_scratch_8000_lab_20260531
dataset_path: ''
detect_anomaly: false
debug: false
wandb: false
eval: false
bg_color: white
dataset:
  name: neuman
  seq: lab
  mono_depth_dir: data/neuman/dataset/lab/mono_depth
train:
  batch_size: 1
  num_workers: 0
  num_steps: 7998
  save_ckpt_interval: 8000
  val_interval: 1000
  anim_interval: -1
  optim_scene: true
  save_progress_images: true
  progress_save_interval: 2000
human:
  name: hugs_trimlp
  # Stage 2 checkpoint (temporal attention)
  ckpt: output/human_scene/neuman/lab/hugs_trimlp/depth_sup12k_temporal_smooth_attn_6000_lab_20260531/2026-05-31_19-54-16/ckpt/human_final.pth
  sh_degree: 0
  n_subdivision: 2
  only_rgb: false
  use_surface: false
  use_deformer: true
  init_2d: false
  disable_posedirs: true
  res_offset: false
  rotate_sh: false
  isotropic: false
  init_scale_multiplier: 0.5
  run_init: false
  skip_init_opt: true
  estimate_delta: true
  triplane_res: 256
  optim_pose: false
  optim_betas: false
  optim_trans: false
  optim_eps_offsets: false
  activation: relu
  canon_nframes: 60
  canon_pose_type: da_pose
  knn_n_hops: 3
  lr:
    wd: 0.0
    position: 0.0
    position_init: 0.0
    position_final: 0.0
    position_delay_mult: 0.01
    position_max_steps: 30000
    opacity: 0.0
    scaling: 0.0
    rotation: 0.0
    feature: 0.0
    smpl_spatial: 0.0
    smpl_pose: 0.0
    smpl_betas: 0.0
    smpl_trans: 0.0
    smpl_eps_offset: 0.0
    lbs_weights: 0.0
    posedirs: 0.0
    percent_dense: 0.01
    appearance: 0.0
    geometry: 0.0
    vembed: 0.0
    deformation: 0.0
    scale_lr_w_npoints: false
  loss:
    ssim_w: 0.2
    l1_w: 0.8
    lpips_w: 1.0
    lbs_w: 1000.0
    humansep_w: 1.0
    depth_w: 0.05
    num_patches: 4
    patch_size: 128
    use_patches: 1
  densification_interval: 600
  opacity_reset_interval: 999999
  densify_from_iter: 999999
  densify_until_iter: 999999
  densify_grad_threshold: 0.0002
  prune_min_opacity: 0.005
  densify_extent: 1.0
  max_n_gaussians: 524288
  percent_dense: 0.01
scene:
  name: scene_gs
  # No ckpt — scene re-initializes from point cloud
  ckpt: ''
  sh_degree: 3
  add_bg_points: false
  num_bg_points: 204800
  bg_sphere_dist: 5.0
  clean_pcd: false
  init_pcd_path: null
  opt_start_iter: 0
  lr:
    percent_dense: 0.01
    spatial_scale: 1.0
    position_init: 1.6e-06
    position_final: 8.0e-07
    position_delay_mult: 0.01
    position_max_steps: 30000
    opacity: 0.005
    scaling: 0.0005
    rotation: 0.0001
    feature: 0.00025
  percent_dense: 0.01
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  prune_min_opacity: 0.005
  max_n_gaussians: 2097152
  loss:
    ssim_w: 0.2
    l1_w: 0.8

scene_sugar:
  enabled: false

scene_global_aware_adc:
  enabled: false

anchor_attention:
  use_anchors: true
  anchor_vertices_path: ''
  count_per_anchor: 64
  top_m: 2
  lambda_lbs: 0.35
  sigma_scale: 1.8
  min_sigma: 0.035
  use_anchor_token_encoder: true
  use_scene_query: true
  use_cross_attention: true
  use_interaction_correction: true
  correct_xyz: true
  correct_opacity: false
  correct_scale: false
  correct_feature_dc: false
  correct_transl: true
  gamma_mu: 0.005
  gamma_transl: 0.05
  transl_delta_clamp: 0.2
  hidden_dim: 128
  human_pooling: attention
  scene_topk: 32
  scene_opacity_threshold: 0.01
  max_scene_candidates: 200000
  module_start_iter: 0
  correction_start_iter: 0
  correction_warmup_iters: 0
  zero_init_delta: true
  gamma_opacity: 0.05
  delta_loss_w: 0.0
  delta_correction_smooth_w: 0.0
  lr: 0.0
  debug_interval: 1000
  debug_dir: ''
  ckpt: output/human_scene/neuman/lab/hugs_trimlp/depth_sup12k_temporal_smooth_attn_6000_lab_20260531/2026-05-31_19-54-16/ckpt/anchor_attention_final.pth
  temporal:
    enabled: true
    memory_size: 100
    decay: 0.85
    temporal_window: 5
    smooth_loss_w: 0.0
    temporal_bias_scale: 1.0
