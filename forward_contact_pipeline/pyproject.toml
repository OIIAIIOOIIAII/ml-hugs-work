[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hugs-contact-streaming"
version = "0.1.0"
description = "Numeric contact experiment components for the HUGS project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7", "torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["contact_streaming*"]
